<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
        />
        <meta
            name="description"
            content="Ashi@ — Ashiatoを偶然見つけるためのMisskeyクライアント"
        />
        <title>Ashi@</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="splash" class="splash" aria-hidden="true">
            <h1>Ashi@</h1>
            <p class="subtitle">どこにいた？</p>
        </div>
        <main id="app" inert>
            <header>
                <div class="top-actions">
                    <div class="menu">
                        <button
                            id="menuToggle"
                            type="button"
                            class="secondary icon-button"
                            aria-haspopup="true"
                            aria-expanded="false"
                            aria-label="メニュー"
                        >
                            ☰
                            <span id="menuBadge" class="badge-dot" hidden></span>
                        </button>
                        <div id="menuDropdown" class="menu-dropdown" hidden>
                            <p id="currentHostLabel" class="menu-current-host"></p>
                            <button
                                id="unlockedListToggle"
                                type="button"
                                aria-haspopup="dialog"
                            >
                                👣あつめたあしあと
                                <span id="unlockedBadge" class="badge-dot" hidden></span>
                            </button>
                            <button
                                id="draftListToggle"
                                type="button"
                                aria-haspopup="dialog"
                            >
                                📝下書き
                            </button>
                            <button id="changeInstance" type="button">
                                インスタンスを変更
                            </button>
                            <button id="clearSearchCache" type="button">
                                検索キャッシュを消す
                            </button>
                            <button id="clearCollected" type="button">
                                あつめたあしあとを消す
                            </button>
                            <button id="aboutButton" type="button">
                                Ashi@について
                            </button>
                        </div>
                    </div>
                </div>
                <div class="search-buttons">
                    <button id="search" type="button">探す</button>
                    <button id="loadNewer" type="button" hidden>
                        最新を確認
                    </button>
                </div>
            </header>
            <div class="map-wrap">
                <section id="map" aria-label="Ashiato map"></section>
                <div id="statusToast" class="status-toast" role="status">
                    <span id="statusText">準備中…</span>
                    <button
                        id="statusClose"
                        type="button"
                        class="status-close"
                        aria-label="閉じる"
                        hidden
                    >
                        ×
                    </button>
                </div>
                <button
                    id="toggleGps"
                    type="button"
                    class="gps-toggle"
                    aria-pressed="false"
                >
                    <span class="gps-toggle-track"
                        ><span class="gps-toggle-knob"></span
                    ></span>
                    <span class="gps-toggle-label">現在地</span>
                </button>
                <button
                    id="toggleArea"
                    type="button"
                    class="gps-toggle area-toggle"
                    aria-pressed="false"
                >
                    <span class="gps-toggle-track"
                        ><span class="gps-toggle-knob"></span
                    ></span>
                    <span class="gps-toggle-label">エリア</span>
                </button>
                <button
                    id="composeAshiato"
                    type="button"
                    class="compose-fab"
                    aria-label="あしあとを投稿"
                >
                    👣
                </button>
            </div>
        </main>
        <dialog id="unlockedListDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="unlockedListCloseX"
                aria-label="閉じる"
            >
                ×
            </button>
            <h2>あつめたあしあと</h2>
            <ul id="unlockedList" class="unlocked-list"></ul>
            <div class="unlocked-list-footer">
                <label class="unlocked-list-filter">
                    <input type="checkbox" id="unopenedOnlyFilter" />
                    未開封のみ表示
                </label>
            </div>
        </dialog>
        <dialog id="composeDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="composeCloseX"
                aria-label="閉じる"
            >
                ×
            </button>
            <h2>あしあとを投稿</h2>
            <fieldset class="precision-fieldset">
                <legend>判定エリアの広さ</legend>
                <label
                    ><input
                        type="radio"
                        name="precision"
                        value="5"
                        checked
                    />
                    約4km</label
                >
                <label
                    ><input type="radio" name="precision" value="6" />
                    約1km</label
                >
                <label
                    ><input type="radio" name="precision" value="7" />
                    約150m</label
                >
            </fieldset>
            <p id="composePrecisionNote" class="dialog-message" hidden></p>
            <div class="dialog-actions">
                <button id="composeSaveDraft" type="button" class="secondary">
                    下書きに保存
                </button>
                <button id="composePost" type="button">投稿する</button>
            </div>
        </dialog>
        <dialog id="draftListDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="draftListCloseX"
                aria-label="閉じる"
            >
                ×
            </button>
            <h2>下書き</h2>
            <ul id="draftList" class="draft-list"></ul>
        </dialog>
        <dialog id="instanceDialog">
            <h2>Misskeyインスタンス</h2>
            <label
                >接続先URL<input
                    id="instance"
                    value="https://misskey.io"
                    inputmode="url" /></label
            >
            <div class="dialog-actions">
                <button id="instanceApply" type="button">適用</button>
                <button id="instanceCancel" type="button" class="secondary">
                    キャンセル
                </button>
            </div>
        </dialog>
        <dialog id="aboutDialog">
            <h2>Ashi@について</h2>
            <p>
                Ashi@は、Misskeyの「#Ashiato」投稿に埋め込まれた位置・時間情報(Ashiato Syntax)をもとに、実際にその場所へ行くと開封できるクライアントです。
            </p>
            <p>
                ここの文章は公開直前に考える
            </p>
            <button id="aboutClose" type="button">閉じる</button>
        </dialog>
        <dialog id="infoDialog">
            <p id="infoMessage" class="dialog-message"></p>
            <div class="dialog-actions">
                <button id="infoOk" type="button">閉じる</button>
            </div>
        </dialog>
        <dialog id="confirmDialog">
            <p id="confirmMessage" class="dialog-message"></p>
            <div class="dialog-actions">
                <button id="confirmCancel" type="button" class="secondary">
                    キャンセル
                </button>
                <button id="confirmOk" type="button">OK</button>
            </div>
        </dialog>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
