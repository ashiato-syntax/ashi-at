<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
        />
        <meta
            name="description"
            content="Ashi@ — あしあとを偶然見つけるためのMisskeyクライアント"
        />
        <title>Ashi@</title>
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <!-- テーマ(ライト/ダーク)の初期反映。IndexedDBは非同期のため、CSS適用前に
             間に合わずライト→ダークのフラッシュが起きてしまう。そのため、選択した
             テーマをmain.ts側でlocalStorageにも同期でミラーしておき(キー名は
             main.ts: THEME_STORAGE_KEYと一致させること)、ここで最初にそれを
             同期的に読んでdata-theme属性を先に確定させる。 -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("ashi-at-theme");
                    var resolved =
                        saved === "light" || saved === "dark"
                            ? saved
                            : window.matchMedia &&
                                window.matchMedia("(prefers-color-scheme: dark)").matches
                              ? "dark"
                              : "light";
                    document.documentElement.dataset.theme = resolved;
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div id="splash" class="splash" aria-hidden="true">
            <h1>Ashi@</h1>
            <p class="subtitle">どこにいた？</p>
        </div>
        <main id="app" inert>
            <div class="map-wrap">
                <section id="map" aria-label="Ashiato map"></section>
                <div class="toggle-panel">
                    <button
                        id="togglePanelCollapse"
                        type="button"
                        class="toggle-panel-handle"
                        aria-expanded="true"
                        aria-label="設定パネルの折りたたみ"
                    >
                        <span class="toggle-panel-handle-icon"></span>
                    </button>
                    <div id="togglePanelRows" class="toggle-panel-rows">
                        <button
                            id="toggleGps"
                            type="button"
                            class="toggle-panel-row"
                            aria-pressed="false"
                        >
                            <span class="gps-toggle-label">現在地</span>
                            <span class="gps-toggle-track"
                                ><span class="gps-toggle-knob"></span
                            ></span>
                        </button>
                        <button
                            id="toggle24h"
                            type="button"
                            class="toggle-panel-row"
                            aria-pressed="false"
                        >
                            <span class="gps-toggle-label">24H以内</span>
                            <span class="gps-toggle-track"
                                ><span class="gps-toggle-knob"></span
                            ></span>
                        </button>
                        <button
                            id="toggleHideRead"
                            type="button"
                            class="toggle-panel-row"
                            aria-pressed="false"
                        >
                            <span class="gps-toggle-label">既読エリアを隠す</span>
                            <span class="gps-toggle-track"
                                ><span class="gps-toggle-knob"></span
                            ></span>
                        </button>
                        <div class="toggle-panel-row">
                            <span class="gps-toggle-label-group">
                                <span class="gps-toggle-label">表示レイヤー</span>
                                <button
                                    id="precisionFilterInfo"
                                    type="button"
                                    class="toggle-info-btn"
                                    aria-label="表示レイヤーについて"
                                ></button>
                            </span>
                            <div class="precision-filter-chips">
                                <button
                                    type="button"
                                    class="precision-filter-chip"
                                    data-length="4"
                                    aria-pressed="true"
                                    aria-label="約20kmの範囲の表示切り替え"
                                ></button>
                                <button
                                    type="button"
                                    class="precision-filter-chip"
                                    data-length="5"
                                    aria-pressed="true"
                                    aria-label="約4kmの範囲の表示切り替え"
                                ></button>
                                <button
                                    type="button"
                                    class="precision-filter-chip"
                                    data-length="6"
                                    aria-pressed="true"
                                    aria-label="約1kmの範囲の表示切り替え"
                                ></button>
                                <button
                                    type="button"
                                    class="precision-filter-chip"
                                    data-length="7"
                                    aria-pressed="true"
                                    aria-label="約150mの範囲の表示切り替え"
                                ></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="precisionWarning" class="precision-warning" hidden>
                    現在地の精度が低いです
                </div>
                <div id="discoveryBanner" class="discovery-banner" hidden></div>
                <div class="hud-bottom">
                    <div id="statusToast" class="status-toast" role="status" hidden>
                        <span id="statusIcon" class="status-icon"></span>
                        <span id="statusText"></span>
                        <button
                            id="statusClose"
                            type="button"
                            class="status-close"
                            aria-label="閉じる"
                            hidden
                        ></button>
                    </div>
                    <div class="bottom-toolbar">
                        <div class="search-buttons">
                            <button id="loadNewer" type="button" class="toolbar-btn">
                                <span class="toolbar-btn-icon"></span>
                                <span>最新を確認</span>
                            </button>
                            <button id="search" type="button" class="toolbar-btn">
                                <span class="toolbar-btn-icon"></span>
                                <span>過去を探す</span>
                            </button>
                        </div>
                        <div class="menu">
                            <button
                                id="menuToggle"
                                type="button"
                                class="menu-fab"
                                aria-haspopup="true"
                                aria-expanded="false"
                                aria-label="メニュー"
                            >
                                <span class="menu-fab-icon"></span>
                                <span id="menuBadge" class="badge-dot" hidden></span>
                            </button>
                            <div id="menuDropdown" class="menu-dropdown" hidden>
                                <p
                                    id="currentHostLabel"
                                    class="menu-current-host"
                                ></p>
                                <button id="aboutButton" type="button">
                                    <span class="menu-item-icon"></span>
                                    <span class="menu-item-label"
                                        >Ashi@について</span
                                    >
                                </button>
                                <button
                                    id="settingsToggle"
                                    type="button"
                                    aria-haspopup="dialog"
                                >
                                    <span class="menu-item-icon"></span>
                                    <span class="menu-item-label">設定</span>
                                </button>
                                <button
                                    id="draftListToggle"
                                    type="button"
                                    aria-haspopup="dialog"
                                >
                                    <span class="menu-item-icon"></span>
                                    <span class="menu-item-label">下書き</span>
                                    <span
                                        id="draftBadge"
                                        class="menu-item-count"
                                        hidden
                                    ></span>
                                </button>
                                <button
                                    id="unlockedListToggle"
                                    type="button"
                                    aria-haspopup="dialog"
                                >
                                    <span class="menu-item-icon"></span>
                                    <span class="menu-item-label"
                                        >見つけたあしあと</span
                                    >
                                    <span
                                        id="unlockedBadge"
                                        class="menu-item-count unread"
                                        hidden
                                    ></span>
                                </button>
                                <button
                                    id="composeAshiatoMenuItem"
                                    class="accent"
                                    type="button"
                                >
                                    <span class="menu-item-icon"></span>
                                    <span class="menu-item-label"
                                        >あしあとを投稿</span
                                    >
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <dialog id="unlockedListDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="unlockedListCloseX"
                aria-label="閉じる"
            ></button>
            <span
                class="sheet-drag-indicator"
                id="unlockedListDragIndicator"
                aria-hidden="true"
            ></span>
            <h2 class="sheet-handle">// 見つけたあしあと</h2>
            <div class="unlocked-list-controls">
                <label class="unlocked-list-filter">
                    <input type="checkbox" id="unreadOnlyFilter" />
                    未読のみ
                </label>
                <label class="unlocked-list-sort">
                    並び順
                    <select id="unlockedSortMode">
                        <option value="unlocked">発見日順</option>
                        <option value="posted">投稿日順</option>
                    </select>
                </label>
            </div>
            <ul id="unlockedList" class="unlocked-list"></ul>
        </dialog>
        <dialog id="ashiatoActionDialog" aria-label="あしあとの情報">
            <button
                type="button"
                class="dialog-close-x"
                id="ashiatoActionCloseX"
                aria-label="閉じる"
            ></button>
            <div class="action-sheet">
                <div class="action-sheet-info">
                    <div class="action-sheet-row action-sheet-heading">
                        <span class="action-sheet-icon" id="ashiatoInfoHeadingIcon"></span>
                        <span>情報</span>
                    </div>
                    <dl id="ashiatoActionInfo" class="ashiato-info-details"></dl>
                </div>
                <button
                    id="ashiatoActionShowOnMap"
                    type="button"
                    class="action-sheet-row"
                >
                    <span
                        class="action-sheet-icon"
                        id="ashiatoActionShowOnMapIcon"
                    ></span>
                    <span>マップで表示する</span>
                </button>
                <button
                    id="ashiatoActionOpenPost"
                    type="button"
                    class="action-sheet-row"
                >
                    <span
                        class="action-sheet-icon"
                        id="ashiatoActionOpenPostIcon"
                    ></span>
                    <span>投稿先のSNSで開く（外部サイトが開きます）</span>
                </button>
                <button
                    id="ashiatoActionDelete"
                    type="button"
                    class="action-sheet-row danger"
                >
                    <span
                        class="action-sheet-icon"
                        id="ashiatoActionDeleteIcon"
                    ></span>
                    <span>「見つけたあしあと」から削除する</span>
                </button>
            </div>
        </dialog>
        <dialog id="mediaLightbox" aria-label="画像を拡大表示">
            <button
                type="button"
                class="dialog-close-x media-lightbox-close"
                id="mediaLightboxCloseX"
                aria-label="閉じる"
            ></button>
            <button
                type="button"
                class="media-lightbox-nav media-lightbox-prev"
                id="mediaLightboxPrev"
                aria-label="前の画像"
                hidden
            ></button>
            <img id="mediaLightboxImg" class="media-lightbox-img" alt="" />
            <button
                type="button"
                class="media-lightbox-nav media-lightbox-next"
                id="mediaLightboxNext"
                aria-label="次の画像"
                hidden
            ></button>
            <span
                id="mediaLightboxCounter"
                class="media-lightbox-counter"
                hidden
            ></span>
        </dialog>
        <dialog id="composeDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="composeCloseX"
                aria-label="閉じる"
            ></button>
            <h2>// あしあとを投稿</h2>
            <fieldset class="precision-fieldset">
                <legend>
                    <span class="action-sheet-icon" id="composePrecisionIcon"></span>
                    <span>エリアサイズ</span>
                </legend>
                <label
                    ><input type="radio" name="precision" value="4" />
                    約20km</label
                >
                <label
                    ><input
                        type="radio"
                        name="precision"
                        value="5"
                        checked
                    />
                    約4km</label
                >
                <label
                    ><input type="radio" name="precision" value="6" />
                    約1km</label
                >
                <label
                    ><input type="radio" name="precision" value="7" />
                    約150m</label
                >
            </fieldset>
            <p id="composePrecisionNote" class="dialog-message" hidden></p>
            <textarea
                id="composeMemo"
                class="compose-memo-input"
                rows="2"
                placeholder="下書きメモ(任意)"
                aria-label="下書きメモ(任意)"
            ></textarea>
            <div class="dialog-actions">
                <button id="composeSaveDraft" type="button" class="secondary">
                    下書きに保存
                </button>
                <button id="composePost" type="button" class="btn-primary">
                    投稿する
                </button>
            </div>
        </dialog>
        <dialog id="draftListDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="draftListCloseX"
                aria-label="閉じる"
            ></button>
            <span
                class="sheet-drag-indicator"
                id="draftListDragIndicator"
                aria-hidden="true"
            ></span>
            <h2 class="sheet-handle">// 下書き</h2>
            <ul id="draftList" class="draft-list"></ul>
        </dialog>
        <dialog id="settingsDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="settingsCloseX"
                aria-label="閉じる"
            ></button>
            <h2>// 設定</h2>
            <div class="settings-dialog-body">
                <div class="action-sheet">
                    <button id="changeInstance" type="button" class="action-sheet-row">
                        <span
                            class="action-sheet-icon"
                            id="changeInstanceIcon"
                        ></span>
                        <span>インスタンスを変更</span>
                    </button>
                </div>
                <div class="settings-collapsible">
                    <button
                        type="button"
                        id="themeToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span
                                class="action-sheet-icon"
                                id="themeIcon"
                            ></span>
                            <span>テーマ</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="themeRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <fieldset class="settings-fieldset">
                                <label
                                    ><input
                                        type="radio"
                                        name="theme"
                                        value="system"
                                        checked
                                    />
                                    デバイスの設定に従う</label
                                >
                                <label
                                    ><input
                                        type="radio"
                                        name="theme"
                                        value="light"
                                    />
                                    ライト</label
                                >
                                <label
                                    ><input
                                        type="radio"
                                        name="theme"
                                        value="dark"
                                    />
                                    ダーク</label
                                >
                            </fieldset>
                        </div>
                    </div>
                </div>
                <div class="settings-collapsible">
                    <button
                        type="button"
                        id="mediaVisibilityToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span
                                class="action-sheet-icon"
                                id="mediaVisibilityIcon"
                            ></span>
                            <span>メディアの表示</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="mediaVisibilityRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <fieldset class="settings-fieldset">
                                <label
                                    ><input
                                        type="radio"
                                        name="mediaVisibility"
                                        value="hide-all"
                                    />
                                    メディアを全て隠す</label
                                >
                                <label
                                    ><input
                                        type="radio"
                                        name="mediaVisibility"
                                        value="hide-sensitive"
                                        checked
                                    />
                                    センシティブなメディアを隠す</label
                                >
                                <label
                                    ><input
                                        type="radio"
                                        name="mediaVisibility"
                                        value="show-all"
                                    />
                                    センシティブなメディアを隠さない</label
                                >
                            </fieldset>
                        </div>
                    </div>
                </div>
                <div class="settings-collapsible">
                    <button
                        type="button"
                        id="mfmDisplayToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span
                                class="action-sheet-icon"
                                id="mfmDisplayIcon"
                            ></span>
                            <span>MFMの表示</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="mfmDisplayRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <fieldset class="settings-fieldset">
                                <label
                                    ><input
                                        type="radio"
                                        name="mfmDisplay"
                                        value="simple"
                                        checked
                                    />
                                    簡易表示</label
                                >
                                <label
                                    ><input
                                        type="radio"
                                        name="mfmDisplay"
                                        value="full"
                                    />
                                    フル表示</label
                                >
                            </fieldset>
                        </div>
                    </div>
                </div>
                <div class="settings-collapsible">
                    <button
                        type="button"
                        id="layerDisplayToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span
                                class="action-sheet-icon"
                                id="layerDisplayIcon"
                            ></span>
                            <span>レイヤーの表示</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="layerDisplayRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <fieldset class="settings-fieldset">
                                <label
                                    ><input
                                        type="checkbox"
                                        id="autoEnableLayerOnDiscovery"
                                        checked
                                    />
                                    現地であしあとを発見したら、そのあしあとの表示レイヤーを自動でONにする</label
                                >
                            </fieldset>
                        </div>
                    </div>
                </div>
                <div class="action-sheet">
                    <button
                        id="clearSearchCache"
                        type="button"
                        class="action-sheet-row"
                    >
                        <span
                            class="action-sheet-icon"
                            id="clearSearchCacheIcon"
                        ></span>
                        <span>検索キャッシュを消す</span>
                    </button>
                    <button
                        id="resetAll"
                        type="button"
                        class="action-sheet-row danger"
                    >
                        <span
                            class="action-sheet-icon"
                            id="resetAllIcon"
                        ></span>
                        <span>リセット</span>
                    </button>
                </div>
            </div>
        </dialog>
        <dialog id="instanceDialog">
            <h2>Misskeyインスタンス</h2>
            <label
                >接続先URL<input
                    id="instance"
                    value="https://misskey.io"
                    inputmode="url" /></label
            >
            <div class="dialog-actions">
                <button id="instanceCancel" type="button" class="secondary">
                    キャンセル
                </button>
                <button id="instanceApply" type="button" class="btn-primary">
                    適用
                </button>
            </div>
        </dialog>
        <dialog id="aboutDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="aboutCloseX"
                aria-label="閉じる"
            ></button>
            <h2>// Ashi@について</h2>
            <div class="about-dialog-body">
                <div id="aboutIntro"></div>
                <div class="action-sheet">
                    <button id="showOnboarding" type="button" class="action-sheet-row">
                        <span class="action-sheet-icon" id="showOnboardingIcon"></span>
                        <span>アプリの使い方を見る</span>
                    </button>
                </div>
                <div class="settings-collapsible about-collapsible">
                    <button
                        type="button"
                        id="termsToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span class="action-sheet-icon" id="termsIcon"></span>
                            <span>利用規約</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="termsRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <div id="termsContent" class="markdown-doc"></div>
                        </div>
                    </div>
                </div>
                <div class="settings-collapsible about-collapsible">
                    <button
                        type="button"
                        id="privacyToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span class="action-sheet-icon" id="privacyIcon"></span>
                            <span>プライバシーポリシー</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="privacyRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <div id="privacyContent" class="markdown-doc"></div>
                        </div>
                    </div>
                </div>
                <div class="settings-collapsible about-collapsible">
                    <button
                        type="button"
                        id="licenseToggle"
                        class="settings-collapsible-toggle"
                        aria-expanded="false"
                    >
                        <span class="settings-collapsible-toggle-label">
                            <span class="action-sheet-icon" id="licenseIcon"></span>
                            <span>ライセンス情報</span>
                        </span>
                        <span class="settings-collapsible-toggle-icon"></span>
                    </button>
                    <div id="licenseRows" class="settings-collapsible-rows">
                        <div class="settings-collapsible-rows-inner">
                            <div id="licenseContent" class="markdown-doc"></div>
                        </div>
                    </div>
                </div>
            </div>
        </dialog>
        <dialog id="onboardingDialog">
            <button
                type="button"
                class="dialog-close-x"
                id="onboardingCloseX"
                aria-label="閉じる"
            ></button>
            <h2 id="onboardingTitle"></h2>
            <div class="onboarding-body">
                <span class="onboarding-icon" id="onboardingIcon"></span>
                <p class="onboarding-text" id="onboardingText"></p>
            </div>
            <div class="onboarding-footer">
                <div class="onboarding-dots" id="onboardingDots"></div>
                <div class="onboarding-nav">
                    <button type="button" id="onboardingBack" class="secondary">
                        戻る
                    </button>
                    <button type="button" id="onboardingNext" class="btn-primary">
                        次へ
                    </button>
                </div>
            </div>
        </dialog>
        <dialog id="confirmDialog">
            <div id="confirmMessage" class="dialog-message"></div>
            <div class="dialog-actions">
                <button id="confirmCancel" type="button" class="secondary">
                    キャンセル
                </button>
                <button id="confirmOk" type="button">OK</button>
            </div>
        </dialog>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
